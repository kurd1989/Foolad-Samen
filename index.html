<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="نرم‌افزار چک‌لیست و گزارش کار فولاد ثامن پایتخت" />
  <title>فولاد ثامن پایتخت | سامانه عملیاتی</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            dark: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <!-- App Container -->
  <div id="app" class="min-h-screen flex flex-col max-w-lg mx-auto bg-white shadow-2xl relative overflow-hidden">

    <!-- Header -->
    <header id="header" class="bg-gradient-to-l from-slate-900 to-slate-800 text-white px-4 py-3 sticky top-0 z-50 shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="btn-menu" class="p-2 rounded-lg hover:bg-white/10 active:scale-95 transition">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          <div>
            <h1 class="font-bold text-lg leading-tight">فولاد ثامن پایتخت</h1>
            <p class="text-xs text-slate-300">سامانه عملیاتی موبایل</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-sync" class="p-2 rounded-lg hover:bg-white/10 relative" title="همگام‌سازی">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            <span id="sync-badge" class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-500 rounded-full hidden"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-24">
      <!-- Content will be injected here -->
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-50">
      <div class="grid grid-cols-4 h-16">
        <button data-page="home" class="nav-btn active flex flex-col items-center justify-center gap-1 text-primary-600">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[11px] font-medium">خانه</span>
        </button>
        <button data-page="forms" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-500">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          <span class="text-[11px] font-medium">فرم‌ها</span>
        </button>
        <button data-page="reports" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-500">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span class="text-[11px] font-medium">گزارش‌ها</span>
        </button>
        <button data-page="admin" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-500">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span class="text-[11px] font-medium">مدیریت</span>
        </button>
      </div>
    </nav>

    <!-- Side Menu (Drawer) -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/50 z-[60] hidden opacity-0 transition-opacity"></div>
    <aside id="drawer" class="fixed top-0 right-0 h-full w-72 bg-white z-[70] transform translate-x-full transition-transform duration-300 shadow-2xl">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg">منوی اصلی</h2>
          <p class="text-xs text-slate-500">نسخه ۱.۰.۰</p>
        </div>
        <button id="btn-close-drawer" class="p-2 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-3 space-y-1">
        <button data-page="home" class="drawer-item w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 text-right">
          <i data-lucide="home" class="w-5 h-5 text-slate-500"></i>
          <span>صفحه اصلی</span>
        </button>
        <button data-page="forms" class="drawer-item w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 text-right">
          <i data-lucide="clipboard-list" class="w-5 h-5 text-slate-500"></i>
          <span>فرم‌ها و چک‌لیست‌ها</span>
        </button>
        <button data-page="reports" class="drawer-item w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 text-right">
          <i data-lucide="file-text" class="w-5 h-5 text-slate-500"></i>
          <span>گزارش‌های ثبت‌شده</span>
        </button>
        <button data-page="admin" class="drawer-item w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 text-right">
          <i data-lucide="shield" class="w-5 h-5 text-slate-500"></i>
          <span>پنل مدیریت</span>
        </button>
        <hr class="my-3 border-slate-100">
        <button id="btn-install" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-emerald-50 text-emerald-700 text-right">
          <i data-lucide="download" class="w-5 h-5"></i>
          <span>نصب اپلیکیشن</span>
        </button>
      </div>
    </aside>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 left-4 right-4 z-[100] space-y-2 pointer-events-none"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/storage.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Start the app
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });

    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker registered:', reg.scope);
          })
          .catch(err => {
            console.log('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
